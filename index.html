<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>한국어 단어 퀴즈 · Korean Word Quiz</title>
<style>
  :root{
    --ink:#1c2b3a;
    --ink-soft:#4d5f70;
    --paper:#eef3f2;
    --card:#ffffff;
    --line:#d7e2df;
    --teal:#1f7a63;
    --teal-deep:#155a49;
    --amber:#e8973a;
    --amber-deep:#c97a20;
    --wrong:#c94b4b;
    --wrong-soft:#fbe7e7;
    --right-soft:#e2f3ec;
    --radius:14px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Helvetica,Arial,sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  button{font-family:inherit;}
  .app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--paper);
  }

  /* ---------- Top bar ---------- */
  .topbar{
    padding:18px 18px 10px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .brand{
    display:flex;
    flex-direction:column;
    line-height:1.15;
  }
  .brand .kr{
    font-size:1.5rem;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  .brand .en{
    font-size:0.8rem;
    color:var(--ink-soft);
    font-weight:600;
  }
  .stat-pill{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    padding:8px 14px;
    font-size:0.82rem;
    font-weight:700;
    color:var(--teal-deep);
    white-space:nowrap;
  }

  /* ---------- Screens ---------- */
  .screen{ flex:1; display:none; flex-direction:column; }
  .screen.active{ display:flex; }

  /* ---------- Level select ---------- */
  .summary-row{
    display:flex;
    gap:10px;
    padding:4px 18px 14px 18px;
  }
  .summary-card{
    flex:1;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
    text-align:center;
  }
  .summary-card .num{
    font-size:1.4rem;
    font-weight:800;
    color:var(--teal-deep);
  }
  .summary-card .lab{
    font-size:0.72rem;
    color:var(--ink-soft);
    font-weight:600;
    margin-top:2px;
  }
  .level-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    padding:4px 18px 24px 18px;
  }
  .level-btn{
    position:relative;
    aspect-ratio:1/1;
    background:var(--card);
    border:2px solid var(--line);
    border-radius:12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    cursor:pointer;
    padding:4px;
  }
  .level-btn:active{ transform:scale(0.96); }
  .level-btn .lv-num{
    font-size:1.15rem;
    font-weight:800;
    color:var(--ink);
  }
  .level-btn .lv-range{
    font-size:0.62rem;
    color:var(--ink-soft);
    font-weight:600;
  }
  .level-btn.done{
    background:var(--teal);
    border-color:var(--teal-deep);
  }
  .level-btn.done .lv-num, .level-btn.done .lv-range{ color:#fff; }
  .level-btn.started:not(.done){
    border-color:var(--amber);
  }
  .level-btn .check{
    position:absolute;
    top:4px;
    right:6px;
    font-size:0.7rem;
  }
  .level-btn .prog{
    position:absolute;
    bottom:4px;
    font-size:0.58rem;
    font-weight:700;
    color:var(--amber-deep);
  }

  .footer-note{
    padding:0 18px 24px 18px;
    font-size:0.75rem;
    color:var(--ink-soft);
    text-align:center;
  }
  .reset-link{
    background:none;
    border:none;
    color:var(--ink-soft);
    text-decoration:underline;
    font-size:0.78rem;
    padding:6px;
    margin:0 auto;
    display:block;
    cursor:pointer;
  }

  /* ---------- Quiz screen ---------- */
  .quiz-top{
    display:flex;
    align-items:center;
    gap:10px;
    padding:16px 16px 8px 16px;
  }
  .back-btn{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 14px;
    font-size:0.95rem;
    font-weight:700;
    color:var(--ink);
    cursor:pointer;
  }
  .quiz-level-title{
    font-weight:800;
    font-size:1rem;
    flex:1;
  }
  .quiz-qcount{
    font-size:0.85rem;
    font-weight:700;
    color:var(--ink-soft);
  }
  .progress-track{
    margin:0 16px 10px 16px;
    height:8px;
    background:var(--line);
    border-radius:999px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--teal);
    border-radius:999px;
    transition:width 0.25s ease;
  }

  .qtype-tag{
    margin:4px 16px 0 16px;
    font-size:0.72rem;
    font-weight:700;
    color:var(--amber-deep);
    text-transform:uppercase;
    letter-spacing:0.03em;
  }

  .question-card{
    margin:10px 16px 14px 16px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:34px 20px;
    text-align:center;
    min-height:92px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .question-card .q-text{
    font-size:1.9rem;
    font-weight:800;
    line-height:1.3;
    word-break:keep-all;
  }
  .question-card.eng .q-text{
    font-size:1.35rem;
  }

  .choices{
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:0 16px;
  }
  .choice-btn{
    background:var(--card);
    border:2px solid var(--line);
    border-radius:12px;
    padding:16px 16px;
    font-size:1.05rem;
    font-weight:600;
    color:var(--ink);
    text-align:left;
    cursor:pointer;
    min-height:56px;
    display:flex;
    align-items:center;
  }
  .choice-btn:active{ transform:scale(0.985); }
  .choice-btn.correct{
    background:var(--right-soft);
    border-color:var(--teal);
    color:var(--teal-deep);
  }
  .choice-btn.wrong{
    background:var(--wrong-soft);
    border-color:var(--wrong);
    color:var(--wrong);
  }
  .choice-btn.disabled{ pointer-events:none; }
  .choice-btn.dim{ opacity:0.55; }

  .feedback{
    margin:12px 16px 0 16px;
    padding:12px 14px;
    border-radius:10px;
    font-size:0.92rem;
    font-weight:700;
    display:none;
  }
  .feedback.show{ display:block; }
  .feedback.ok{ background:var(--right-soft); color:var(--teal-deep); }
  .feedback.no{ background:var(--wrong-soft); color:var(--wrong); }

  .bottom-bar{
    margin-top:auto;
    padding:14px 16px calc(16px + var(--safe-b)) 16px;
  }
  .next-btn{
    width:100%;
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:17px;
    font-size:1.05rem;
    font-weight:800;
    cursor:pointer;
    opacity:0.35;
    pointer-events:none;
  }
  .next-btn.ready{
    opacity:1;
    pointer-events:auto;
    background:var(--teal-deep);
  }
  .next-btn:active{ transform:scale(0.98); }

  /* ---------- Results screen ---------- */
  .result-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:30px 24px calc(24px + var(--safe-b)) 24px;
    text-align:center;
  }
  .result-badge{
    font-size:3rem;
    margin-bottom:6px;
  }
  .result-title{
    font-size:1.5rem;
    font-weight:800;
    margin-bottom:6px;
  }
  .result-sub{
    color:var(--ink-soft);
    font-weight:600;
    margin-bottom:26px;
  }
  .result-score{
    font-size:2.4rem;
    font-weight:800;
    color:var(--teal-deep);
    margin-bottom:26px;
  }
  .result-actions{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .btn-primary{
    background:var(--teal-deep);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:17px;
    font-size:1.05rem;
    font-weight:800;
    cursor:pointer;
  }
  .btn-secondary{
    background:var(--card);
    color:var(--ink);
    border:2px solid var(--line);
    border-radius:12px;
    padding:15px;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
  }
  .btn-primary:active, .btn-secondary:active{ transform:scale(0.98); }

  @media (max-width:360px){
    .level-grid{ grid-template-columns:repeat(4,1fr); gap:8px; }
    .question-card .q-text{ font-size:1.6rem; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- LEVEL SELECT SCREEN -->
  <div id="screen-levels" class="screen active">
    <div class="topbar">
      <div class="brand">
        <div class="kr">단어 퀴즈</div>
        <div class="en">Korean Vocabulary Quiz</div>
      </div>
      <div class="stat-pill" id="totalScorePill">0 correct</div>
    </div>

    <div class="summary-row">
      <div class="summary-card">
        <div class="num" id="completedCount">0</div>
        <div class="lab">Levels Done</div>
      </div>
      <div class="summary-card">
        <div class="num" id="totalLevelsLabel">0</div>
        <div class="lab">Total Levels</div>
      </div>
      <div class="summary-card">
        <div class="num" id="totalWordsLabel">0</div>
        <div class="lab">Total Words</div>
      </div>
    </div>

    <div class="level-grid" id="levelGrid"></div>

    <button class="reset-link" id="resetBtn">Reset all progress</button>
    <div class="footer-note">Tap any level to start. You must answer all 10 correctly in one round to complete it.</div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="screen-quiz" class="screen">
    <div class="quiz-top">
      <button class="back-btn" id="backBtn">← Levels</button>
      <div class="quiz-level-title" id="quizLevelTitle">Level 1</div>
      <div class="quiz-qcount" id="quizQCount">1/10</div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="qtype-tag" id="qtypeTag">Korean → English</div>
    <div class="question-card" id="questionCard"><div class="q-text" id="questionText">단어</div></div>
    <div class="choices" id="choicesWrap"></div>
    <div class="feedback" id="feedback"></div>
    <div class="bottom-bar">
      <button class="next-btn" id="nextBtn">Next →</button>
    </div>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="screen-result" class="screen">
    <div class="result-wrap">
      <div class="result-badge" id="resultBadge">🎉</div>
      <div class="result-title" id="resultTitle">Level Complete!</div>
      <div class="result-sub" id="resultSub">Level 1 · Words 1–10</div>
      <div class="result-score" id="resultScore">10/10</div>
      <div class="result-actions">
        <button class="btn-primary" id="retryBtn">Retry Level</button>
        <button class="btn-secondary" id="toLevelsBtn">Back to Levels</button>
      </div>
    </div>
  </div>

</div>

const WORDS = WORD_DATA.map(function(pair, i){ return { kr: pair[0], en: pair[1], id: i }; });

const LEVEL_SIZE = 10;
const LEVELS = [];
for (let i = 0; i < WORDS.length; i += LEVEL_SIZE) {
  LEVELS.push(WORDS.slice(i, i + LEVEL_SIZE));
}

/* ============ STORAGE (works inside Claude artifacts via window.storage,
   falls back to localStorage for standalone use outside Claude.ai) ============ */
const STORAGE_KEY = "kr_vocab_quiz_progress_v1";

async function storageLoad() {
  try {
    if (window.storage && typeof window.storage.get === "function") {
      const res = await window.storage.get(STORAGE_KEY);
      if (res && res.value) return JSON.parse(res.value);
      return null;
    }
  } catch (e) { /* key not found or storage unavailable */ }
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

async function storageSave(data) {
  const json = JSON.stringify(data);
  try {
    if (window.storage && typeof window.storage.set === "function") {
      await window.storage.set(STORAGE_KEY, json);
      return;
    }
  } catch (e) { /* fall through */ }
  try { localStorage.setItem(STORAGE_KEY, json); } catch (e) { /* ignore */ }
}

let progress = {
  totalCorrect: 0,
  completedLevels: {},   // { levelIndex: true }
  sessions: {}           // { levelIndex: sessionObject } for in-progress levels
};

/* ============ APP STATE ============ */
let currentLevelIndex = null;
let currentSession = null;
let currentChoices = [];   // choices for the active question
let answeredThisQuestion = false;

/* ============ UTIL ============ */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickDistractors(levelWords, correctWordId, count) {
  let pool = levelWords.filter(function(w){ return w.id !== correctWordId; });
  if (pool.length < count) {
    const extra = WORDS.filter(function(w){
      return w.id !== correctWordId && !pool.some(function(p){ return p.id === w.id; });
    });
    pool = pool.concat(shuffle(extra));
  }
  return shuffle(pool).slice(0, count);
}

function levelLabel(idx) {
  const start = idx * LEVEL_SIZE + 1;
  const end = start + LEVELS[idx].length - 1;
  return { title: "Level " + (idx + 1), range: start + "–" + end };
}

/* ============ SESSION BUILDING ============ */
function buildNewSession(levelIndex) {
  const levelWords = LEVELS[levelIndex];
  const order = shuffle(levelWords.map(function(w){ return w.id; }));
  const types = order.map(function(){ return Math.random() < 0.5 ? "kr2en" : "en2kr"; });
  return {
    order: order,
    types: types,
    currentIndex: 0,
    correctCount: 0
  };
}

/* ============ RENDER: LEVEL SELECT ============ */
function renderLevelSelect() {
  document.getElementById("totalLevelsLabel").textContent = LEVELS.length;
  document.getElementById("totalWordsLabel").textContent = WORDS.length;
  document.getElementById("totalScorePill").textContent = progress.totalCorrect + " correct";
  const completedCount = Object.keys(progress.completedLevels).length;
  document.getElementById("completedCount").textContent = completedCount;

  const grid = document.getElementById("levelGrid");
  grid.innerHTML = "";
  LEVELS.forEach(function(_, idx) {
    const info = levelLabel(idx);
    const done = !!progress.completedLevels[idx];
    const sess = progress.sessions[idx];
    const started = !done && sess && sess.currentIndex > 0;

    const btn = document.createElement("div");
    btn.className = "level-btn" + (done ? " done" : "") + (started ? " started" : "");
    btn.innerHTML =
      (done ? '<span class="check">✓</span>' : '') +
      '<span class="lv-num">' + (idx + 1) + '</span>' +
      '<span class="lv-range">' + info.range + '</span>' +
      (started ? '<span class="prog">' + sess.currentIndex + '/' + LEVELS[idx].length + '</span>' : '');
    btn.addEventListener("click", function(){ enterLevel(idx); });
    grid.appendChild(btn);
  });
}

/* ============ NAVIGATION ============ */
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(function(s){ s.classList.remove("active"); });
  document.getElementById(id).classList.add("active");
}

function goToLevels() {
  renderLevelSelect();
  showScreen("screen-levels");
}

function enterLevel(idx) {
  currentLevelIndex = idx;
  const saved = progress.sessions[idx];
  if (saved && saved.currentIndex < saved.order.length) {
    currentSession = saved;
  } else {
    currentSession = buildNewSession(idx);
    progress.sessions[idx] = currentSession;
    storageSave(progress);
  }
  showScreen("screen-quiz");
  renderQuestion();
}

/* ============ RENDER: QUIZ ============ */
function renderQuestion() {
  answeredThisQuestion = false;
  const levelWords = LEVELS[currentLevelIndex];
  const info = levelLabel(currentLevelIndex);
  const total = currentSession.order.length;
  const qIdx = currentSession.currentIndex;
  const wordId = currentSession.order[qIdx];
  const type = currentSession.types[qIdx];
  const word = WORDS[wordId];

  document.getElementById("quizLevelTitle").textContent = info.title;
  document.getElementById("quizQCount").textContent = (qIdx + 1) + "/" + total;
  document.getElementById("progressFill").style.width = Math.round((qIdx / total) * 100) + "%";

  const qCard = document.getElementById("questionCard");
  const qText = document.getElementById("questionText");
  const qtypeTag = document.getElementById("qtypeTag");

  const distractors = pickDistractors(levelWords, wordId, 3);

  if (type === "kr2en") {
    qtypeTag.textContent = "Korean → English";
    qCard.classList.remove("eng");
    qText.textContent = word.kr;
    currentChoices = shuffle([{ text: word.en, correct: true }].concat(
      distractors.map(function(d){ return { text: d.en, correct: false }; })
    ));
  } else {
    qtypeTag.textContent = "English → Korean";
    qCard.classList.add("eng");
    qText.textContent = word.en;
    currentChoices = shuffle([{ text: word.kr, correct: true }].concat(
      distractors.map(function(d){ return { text: d.kr, correct: false }; })
    ));
  }

  const wrap = document.getElementById("choicesWrap");
  wrap.innerHTML = "";
  currentChoices.forEach(function(choice, i) {
    const b = document.createElement("button");
    b.className = "choice-btn";
    b.textContent = choice.text;
    b.addEventListener("click", function(){ handleAnswer(i); });
    wrap.appendChild(b);
  });

  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").textContent = "";
  const nextBtn = document.getElementById("nextBtn");
  nextBtn.classList.remove("ready");
  nextBtn.textContent = (qIdx === total - 1) ? "Finish Level →" : "Next →";
}

function handleAnswer(choiceIndex) {
  if (answeredThisQuestion) return;
  answeredThisQuestion = true;

  const buttons = document.querySelectorAll(".choice-btn");
  const picked = currentChoices[choiceIndex];
  const feedback = document.getElementById("feedback");

  buttons.forEach(function(b, i) {
    b.classList.add("disabled");
    if (currentChoices[i].correct) {
      b.classList.add("correct");
    } else if (i === choiceIndex) {
      b.classList.add("wrong");
    } else {
      b.classList.add("dim");
    }
  });

  if (picked.correct) {
    currentSession.correctCount++;
    feedback.className = "feedback show ok";
    feedback.textContent = "Correct! 정답이에요.";
  } else {
    const correctChoice = currentChoices.find(function(c){ return c.correct; });
    feedback.className = "feedback show no";
    feedback.textContent = "Not quite. Correct answer: " + correctChoice.text;
  }

  document.getElementById("nextBtn").classList.add("ready");
}

function goNext() {
  if (!answeredThisQuestion) return;
  currentSession.currentIndex++;

  if (currentSession.currentIndex >= currentSession.order.length) {
    finishLevel();
  } else {
    progress.sessions[currentLevelIndex] = currentSession;
    storageSave(progress);
    renderQuestion();
  }
}

function finishLevel() {
  const total = currentSession.order.length;
  const correct = currentSession.correctCount;
  progress.totalCorrect += 0; // totalCorrect is tracked live per answer below
  const perfect = correct === total;

  if (perfect) {
    progress.completedLevels[currentLevelIndex] = true;
  }
  delete progress.sessions[currentLevelIndex];
  storageSave(progress);

  const info = levelLabel(currentLevelIndex);
  document.getElementById("resultBadge").textContent = perfect ? "🎉" : "💪";
  document.getElementById("resultTitle").textContent = perfect ? "Level Complete!" : "Almost there";
  document.getElementById("resultSub").textContent = info.title + " · Words " + info.range;
  document.getElementById("resultScore").textContent = correct + "/" + total;
  document.getElementById("retryBtn").textContent = perfect ? "Play Again" : "Retry Level";

  showScreen("screen-result");
}

/* ============ EVENT WIRING ============ */
document.getElementById("nextBtn").addEventListener("click", goNext);
document.getElementById("backBtn").addEventListener("click", function(){
  // save current mid-level progress so it can be resumed later
  if (currentLevelIndex !== null && currentSession) {
    progress.sessions[currentLevelIndex] = currentSession;
    storageSave(progress);
  }
  goToLevels();
});
document.getElementById("retryBtn").addEventListener("click", function(){
  enterLevel(currentLevelIndex);
});
document.getElementById("toLevelsBtn").addEventListener("click", goToLevels);
document.getElementById("resetBtn").addEventListener("click", function(){
  if (confirm("Reset all progress and scores? This cannot be undone.")) {
    progress = { totalCorrect: 0, completedLevels: {}, sessions: {} };
    storageSave(progress);
    goToLevels();
  }
});

/* track cumulative total correct answers (kept separate from level completion) */
const origHandleAnswer = handleAnswer;
handleAnswer = function(choiceIndex) {
  const wasAnsweredBefore = answeredThisQuestion;
  origHandleAnswer(choiceIndex);
  if (!wasAnsweredBefore && currentChoices[choiceIndex] && currentChoices[choiceIndex].correct) {
    progress.totalCorrect++;
    storageSave(progress);
  }
};

/* ============ INIT ============ */
(async function init(){
  const loaded = await storageLoad();
  if (loaded) {
    progress = Object.assign({ totalCorrect: 0, completedLevels: {}, sessions: {} }, loaded);
  }
  goToLevels();
})();
</script>
